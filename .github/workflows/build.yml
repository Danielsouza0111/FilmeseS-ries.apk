
name: Gerar APK Daniel Souza

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          unzip -o DanielSouzaAndroid-Projeto.zip -d projeto

      - name: Compilar APK
        run: |
          cd projeto
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: DanielSouza-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
