
name: Gerar APK Daniel Souza

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair ZIP
        run: |
          mkdir projeto
          unzip -o DanielSouzaAndroid-Projeto.zip -d projeto
          echo "Arquivos encontrados:"
          find projeto -maxdepth 4 -type f | head -100

      - name: Procurar Gradle
        run: |
          find projeto -name gradlew -type f

      - name: Compilar APK
        run: |
          GRADLEW=$(find projeto -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERRO: Não foi encontrado gradlew. Precisamos conferir o conteúdo do ZIP."
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: DanielSouza-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
